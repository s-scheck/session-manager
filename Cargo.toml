[package]
name = "session_manager"
version = "0.1.0"
edition = "2024"
description = "A minimal terminal session manager — a Rust reimplementation of abduco"
license = "ISC"

[[bin]]
name = "sm"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = [
    "term",     # termios (raw mode) and the pty module (forkpty/openpty)
    "process",  # fork, execvp, setsid, waitpid
    "signal",   # sigaction, SigSet, kill
    "fs",       # pipe, flags
    "poll",     # poll(2) event loop
    "user",     # uid/username lookups for socket dirs
] }
# libc is already in the tree via nix; we use it directly for the winsize
# ioctls and a few raw fd syscalls in the hot event loop.
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
